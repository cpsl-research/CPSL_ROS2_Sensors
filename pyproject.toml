[project]
name = "cpsl_ros2_sensors"
version = "0.1.0"
description = "Custom Python Environment for ROS2 workspaces"
authors = [{ name = "David Hunt", email = "dmh89@duke.edu" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "build (>=1.2.2.post1,<2.0.0)",
    "cffi (>=1.17.1,<2.0.0)",
    "opencv-python (>=3.0,<5.0.0.0)",
    "numpy (>=1.25,<2.0.0)",
    "setuptools (<80)",
    "requests (>=2.31.0)"
]

# The venv only carries python dependencies for the ROS nodes; this repo is a
# colcon workspace, not a python package, so uv never builds or installs it.
#
# The venv must be created with --system-site-packages so rclpy, colcon and the
# rest of /opt/ros stay importable (see scripts/setup_venv.sh).
#
# The Leap Motion bindings (submodules/leapc-python-bindings/leapc-python-api)
# are deliberately NOT listed here: that submodule is normally not checked out,
# and uv cannot lock a path dependency that is not on disk. When leapmotion is
# selected, scripts/setup_venv.sh installs them into the venv directly.
[tool.uv]
package = false
