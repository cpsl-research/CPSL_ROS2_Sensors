services:
  cpsl_sensors:
    image: cpsl_sensors:gpu
    container_name: cpsl_sensors_gpu
    ipc: host
    environment:
      - ROS_DOMAIN_ID=42
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all,graphics,utility,compute
    ports:
      # TI Radar DCA1000 Streaming Port Forwarding
      - "4096:4096/udp"
      - "4098:4098/udp"
      # Livox Mid360 Lidar Port Forwarding
      - "56101:56101/udp"
      - "56201:56201/udp"
      - "56301:56301/udp"
      - "56401:56401/udp"
    devices:
      # TI Radars serial CLI & data interfaces
      - "/dev/ttyACM0:/dev/ttyACM0"
      - "/dev/ttyACM1:/dev/ttyACM1"
    volumes:
      - "/tmp/.X11-unix:/tmp/.X11-unix:ro"
      - "${HOME}/.Xauthority:/root/.Xauthority:ro"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility, graphics]
    stdin_open: true
    tty: true
    networks:
      cpsl_net:
        ipv4_address: 192.168.1.42

  gateway_simulator:
    image: alpine:latest
    container_name: gateway_simulator
    command: ping localhost
    profiles:
      - test-router
    networks:
      cpsl_net:
        ipv4_address: 192.168.1.1
    restart: always

networks:
  cpsl_net:
    name: cpsl_net
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.254
