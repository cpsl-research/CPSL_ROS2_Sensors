# v2 recorder config (dataset_recorder): one Ouster lidar (ouster_lidar_bringup.launch.py, driver namespace).
# Usage: ros2 launch dataset_generator record_dataset.launch.py param_file:=ouster.yaml
# Topics are relative to the recorder's namespace. The driver is run with timestamp_mode TIME_FROM_ROS_TIME
# (cpsl_ros2_sensors_bringup/ouster_configs/driver_params.yaml), so header stamps are host-clock time.
dataset_generator:
  ros__parameters:
    dataset_path: ""           # empty = the directory the launch was started from
    capture_mode: "all"
    sample_rate_hz: 10.0
    flush_period_s: 5.0
    start_timeout_s: 30.0      # wait this long for every enabled stream (0 = forever); else abort, exit 2
    allow_missing: false
    tf_track: [""]             # no odom here; /tf_static is still recorded
    tf_topic: "tf"
    tf_static_topic: "tf_static"
    streams:
      ouster_lidar:
        topic: "ouster/points"
        type: "sensor_msgs/msg/PointCloud2"
        qos: best_effort
        compression: gzip
        # No `fields`: all nine are stored (x y z intensity t reflectivity ring ambient range).
        # HYPOTHESIS: ~10 Hz scans at the default lidar mode (to be measured on hardware).
