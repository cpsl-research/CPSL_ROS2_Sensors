# v2 recorder config (dataset_recorder): one HDF5 file per capture.
dataset_generator:
  ros__parameters:
    dataset_path: "/home/cpsl/Downloads/datasets/icaRAus_ugv"   # capture_<time>.h5 goes here
    capture_mode: "all"        # all = every message; sampled = latest per tick
    sample_rate_hz: 10.0       # only used by streams in sampled mode
    flush_period_s: 5.0
    start_timeout_s: 30.0      # wait this long for every enabled stream (0 = forever); else abort, exit 2
    allow_missing: false       # true: start at the timeout anyway, silent streams listed in streams_missing
    # Transforms (format v4): /tf_static is always recorded; each "parent->child" below is a
    # direct /tf edge recorded as a time series. [""] turns the series off.
    tf_track: ["odom->base_link"]
    # Relative: resolves in the recorder's namespace (console launches with namespace:=<sensors ns>,
    # so tf is /<ns>/tf). The resolved names are stored in the HDF5 attrs.
    tf_topic: "tf"
    tf_static_topic: "tf_static"
    streams:
      radar_adc:               # name = HDF5 group; legacy_folder = old folder name
        topic: "radar_0/adc_data_cube"
        type: "raw_radar_msgs/msg/ADCDataCube"
        qos: reliable          # 3.4 MB SAR frames are lost with best_effort
        qos_depth: 10
        legacy_folder: "radar_0_adc"
      radar_pc:
        topic: "radar_0/detected_points"
        type: "sensor_msgs/msg/PointCloud2"
        fields: ["x", "y", "z", "vel"]
        legacy_folder: "radar_0_pc"
      camera:
        topic: "camera/image_raw"
        type: "sensor_msgs/msg/Image"
        compression: gzip
        legacy_folder: "camera"
      vehicle_odom:
        topic: "odom_repub"
        type: "nav_msgs/msg/Odometry"
        legacy_folder: "vehicle_odom"
      # off in the v1 config; set enabled: true to record
      lidar:
        enabled: false
        topic: "livox/lidar"
        type: "sensor_msgs/msg/PointCloud2"
        legacy_folder: "lidar"
      imu:
        enabled: false
        topic: "livox/imu"
        type: "sensor_msgs/msg/Imu"
        legacy_folder: "imu_data"
